<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity 风格网页编辑器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#409EFF',
                        success: '#67C23A',
                        warning: '#E6A23C',
                        danger: '#F56C6C',
                        info: '#909399',
                        el: {
                            bg: '#141414',
                            panel: '#1d1e1f',
                            border: '#4c4d4f',
                            text: '#cfd3dc',
                            header: '#1a1a1a',
                            input: '#262727',
                            overlay: '#2b2c2d'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    borderRadius: {
                        'el': '4px'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; transition: background-color 0.2s, border-color 0.2s; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4c4d4f; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #606266; }
        
        .grid-viewport {
            background-color: #0a0a0a;
            background-image: 
                linear-gradient(rgba(64, 158, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(64, 158, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        
        .el-menu-item {
            position: relative;
            transition: color 0.3s, background-color 0.3s;
        }
        .el-menu-item.is-active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #409EFF;
        }

        .el-tabs-item {
            position: relative;
            transition: color 0.3s;
        }
        .el-tabs-item.is-active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #409EFF;
            z-index: 2;
        }

        .el-tree-item:hover { background-color: #2b2c2d; }
        .el-tree-item.active { background-color: rgba(64, 158, 255, 0.1); color: #409EFF; }
    </style>
</head>
<body class="h-screen w-full bg-el-bg text-el-text font-sans text-[13px] flex flex-col overflow-hidden">
    
    <!-- Header Navigation (顶部菜单栏) -->
    <header class="h-12 bg-el-header border-b border-el-border flex items-center px-4 shrink-0 z-50">
        <div class="flex items-center gap-3 mr-8">
            <iconify-icon icon="simple-icons:unity" class="text-2xl text-white"></iconify-icon>
            <span class="font-semibold text-white tracking-tight">Feng3D Editor</span>
        </div>
        
        <nav class="flex items-center h-full">
            <a href="#" class="el-menu-item is-active px-5 h-full flex items-center text-primary font-medium hover:bg-white/5 transition-colors">文件</a>
            <a href="#" class="el-menu-item px-5 h-full flex items-center hover:text-primary hover:bg-white/5 transition-colors">编辑</a>
            <a href="#" class="el-menu-item px-5 h-full flex items-center hover:text-primary hover:bg-white/5 transition-colors">资源</a>
            <a href="#" class="el-menu-item px-5 h-full flex items-center hover:text-primary hover:bg-white/5 transition-colors">游戏对象</a>
            <a href="#" class="el-menu-item px-5 h-full flex items-center hover:text-primary hover:bg-white/5 transition-colors">组件</a>
            <a href="#" class="el-menu-item px-5 h-full flex items-center hover:text-primary hover:bg-white/5 transition-colors">窗口</a>
        </nav>
        
        <div class="flex-1"></div>
        
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <iconify-icon icon="lucide:moon" class="text-lg cursor-pointer hover:text-primary"></iconify-icon>
                <div class="w-8 h-4 bg-el-border rounded-full relative cursor-pointer">
                    <div class="absolute left-1 top-0.5 w-3 h-3 bg-white rounded-full transition-all"></div>
                </div>
            </div>
            <div class="h-4 w-px bg-el-border"></div>
            <iconify-icon icon="lucide:settings" class="text-lg cursor-pointer hover:text-primary"></iconify-icon>
        </div>
    </header>
    
    <!-- Toolbar (工具栏) -->
    <div class="h-12 border-b border-el-border flex items-center px-4 justify-between shrink-0 bg-el-bg">
        <div class="flex items-center gap-2">
            <!-- 变换工具组 -->
            <div class="inline-flex">
                <button class="inline-flex items-center justify-center w-10 h-8 bg-el-overlay border border-el-border rounded-l-el hover:text-primary focus:z-10 transition-colors">
                    <iconify-icon icon="lucide:hand" class="text-lg"></iconify-icon>
                </button>
                <button class="inline-flex items-center justify-center w-10 h-8 bg-el-overlay border-y border-r border-el-border text-primary focus:z-10 transition-colors">
                    <iconify-icon icon="lucide:move" class="text-lg"></iconify-icon>
                </button>
                <button class="inline-flex items-center justify-center w-10 h-8 bg-el-overlay border-y border-r border-el-border hover:text-primary focus:z-10 transition-colors">
                    <iconify-icon icon="lucide:rotate-3d" class="text-lg"></iconify-icon>
                </button>
                <button class="inline-flex items-center justify-center w-10 h-8 bg-el-overlay border border-el-border rounded-r-el hover:text-primary focus:z-10 transition-colors">
                    <iconify-icon icon="lucide:maximize-2" class="text-lg"></iconify-icon>
                </button>
            </div>
            
            <div class="h-4 w-px bg-el-border mx-2"></div>
            
            <!-- Pivot/Center, Local/World -->
            <div class="inline-flex">
                <button class="inline-flex items-center justify-center w-10 h-8 bg-el-overlay border border-el-border rounded-l-el hover:text-primary transition-colors">
                    <iconify-icon icon="lucide:crosshair" class="text-lg"></iconify-icon>
                </button>
                <button class="inline-flex items-center justify-center w-10 h-8 bg-el-overlay border border-el-border rounded-r-el hover:text-primary transition-colors">
                    <iconify-icon icon="lucide:globe" class="text-lg"></iconify-icon>
                </button>
            </div>
        </div>

        <!-- 播放控制 -->
        <div class="flex items-center bg-el-input rounded-el p-1">
            <button class="px-4 h-7 flex items-center gap-2 text-white bg-primary rounded-el shadow-sm hover:opacity-90">
                <iconify-icon icon="lucide:play" class="text-sm"></iconify-icon>
                <span class="font-medium">播放</span>
            </button>
            <button class="px-3 h-7 flex items-center hover:text-primary transition-colors">
                <iconify-icon icon="lucide:pause" class="text-lg"></iconify-icon>
            </button>
            <button class="px-3 h-7 flex items-center hover:text-primary transition-colors">
                <iconify-icon icon="lucide:step-forward" class="text-lg"></iconify-icon>
            </button>
        </div>

        <!-- 右侧工具 -->
        <div class="flex items-center gap-2">
            <div class="flex items-center bg-el-input px-2 h-8 rounded-el border border-el-border focus-within:border-primary transition-all">
                <iconify-icon icon="lucide:search" class="text-el-text opacity-50 mr-2"></iconify-icon>
                <input type="text" placeholder="搜索..." class="bg-transparent border-none outline-none text-xs w-32">
            </div>
            <iconify-icon icon="lucide:help-circle" class="text-lg cursor-pointer hover:text-primary"></iconify-icon>
            <iconify-icon icon="lucide:settings" class="text-lg cursor-pointer hover:text-primary"></iconify-icon>
        </div>
    </div>
    
    <!-- Main Layout (主布局) -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Left Sidebar - Hierarchy (左侧层级面板) -->
        <aside class="w-64 bg-el-panel border-r border-el-border flex flex-col shrink-0">
            <div class="h-10 px-4 border-b border-el-border flex items-center justify-between">
                <span class="font-medium">层级</span>
                <iconify-icon icon="lucide:plus" class="text-sm p-1 hover:bg-el-overlay rounded cursor-pointer"></iconify-icon>
            </div>
            
            <div class="flex-1 overflow-y-auto p-2">
                <div class="space-y-0.5">
                    <div class="el-tree-item flex items-center gap-2 px-2 py-1.5 rounded-el cursor-pointer active">
                        <iconify-icon icon="lucide:chevron-down" class="text-xs"></iconify-icon>
                        <iconify-icon icon="lucide:layers" class="text-sm text-primary"></iconify-icon>
                        <span>场景</span>
                    </div>
                    <div class="ml-4 space-y-0.5">
                        <div class="el-tree-item flex items-center gap-2 px-2 py-1.5 rounded-el cursor-pointer">
                            <iconify-icon icon="lucide:video" class="text-sm text-success"></iconify-icon>
                            <span>主相机</span>
                        </div>
                        <div class="el-tree-item flex items-center gap-2 px-2 py-1.5 rounded-el cursor-pointer">
                            <iconify-icon icon="lucide:sun" class="text-sm text-warning"></iconify-icon>
                            <span>方向光</span>
                        </div>
                        <div class="el-tree-item active flex items-center gap-2 px-2 py-1.5 rounded-el cursor-pointer">
                            <iconify-icon icon="lucide:box" class="text-sm"></iconify-icon>
                            <span>玩家</span>
                        </div>
                        <div class="ml-4">
                            <div class="el-tree-item flex items-center gap-2 px-2 py-1.5 rounded-el cursor-pointer opacity-70">
                                <iconify-icon icon="lucide:box" class="text-sm"></iconify-icon>
                                <span>玩家模型</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
        
        <!-- Center Content (中间内容) -->
        <main class="flex-1 flex flex-col overflow-hidden bg-el-bg">
            <!-- Viewport with tabs (场景视口) -->
            <div class="flex-1 flex flex-col relative overflow-hidden">
                <div class="h-10 bg-el-panel border-b border-el-border flex items-center px-4">
                    <div class="flex items-center h-full space-x-8">
                        <div class="h-full flex items-center el-tabs-item is-active text-primary font-medium cursor-pointer text-sm">场景</div>
                        <div class="h-full flex items-center el-tabs-item text-el-text opacity-70 hover:text-primary hover:opacity-100 cursor-pointer transition-all text-sm">游戏</div>
                    </div>
                </div>
                
                <div class="flex-1 grid-viewport relative flex items-center justify-center overflow-hidden">
                    <!-- 3D 场景占位 -->
                    <div class="relative">
                        <div class="w-40 h-40 bg-primary/20 border-2 border-primary/60 rounded-lg backdrop-blur-sm relative" style="transform: perspective(800px) rotateX(25deg) rotateY(-25deg);">
                            <div class="absolute inset-0 border border-primary/30 flex items-center justify-center">
                                <iconify-icon icon="lucide:box" class="text-5xl text-primary"></iconify-icon>
                            </div>
                        </div>
                        <!-- Transform Handles -->
                        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center justify-center">
                            <div class="w-4 h-4 rounded-full bg-white border-2 border-primary shadow-lg z-10"></div>
                            <div class="absolute w-24 h-0.5 bg-danger shadow-sm origin-left rotate-0 left-2"></div>
                            <div class="absolute h-24 w-0.5 bg-success shadow-sm origin-bottom bottom-2"></div>
                            <div class="absolute w-16 h-0.5 bg-primary shadow-sm origin-left -rotate-45 left-2"></div>
                        </div>
                    </div>

                    <!-- 底部统计信息 -->
                    <div class="absolute bottom-4 right-4 bg-el-overlay/80 backdrop-blur rounded-el p-2 border border-el-border text-[10px] space-y-1 font-mono">
                        <div class="flex justify-between gap-4"><span>FPS:</span><span class="text-success">60.0</span></div>
                        <div class="flex justify-between gap-4"><span>批次:</span><span>243</span></div>
                        <div class="flex justify-between gap-4"><span>三角形:</span><span>12.4k</span></div>
                    </div>
                </div>
            </div>
            
            <!-- Bottom Panel - Console (底部控制台面板) -->
            <div class="h-48 border-t border-el-border flex flex-col bg-el-panel">
                <div class="h-10 border-b border-el-border flex items-center px-4 justify-between">
                    <div class="flex items-center space-x-8 h-full">
                        <div class="h-full flex items-center el-tabs-item is-active text-primary font-medium cursor-pointer text-sm">控制台</div>
                        <div class="h-full flex items-center el-tabs-item text-el-text opacity-70 hover:text-primary hover:opacity-100 cursor-pointer transition-all text-sm">项目</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button class="px-3 py-1 text-xs hover:bg-el-overlay rounded-el border border-el-border transition-colors">清除</button>
                        <div class="h-4 w-px bg-el-border"></div>
                        <div class="flex items-center gap-3 text-xs">
                            <span class="flex items-center gap-1"><iconify-icon icon="lucide:info" class="text-primary"></iconify-icon> 12</span>
                            <span class="flex items-center gap-1"><iconify-icon icon="lucide:alert-triangle" class="text-warning"></iconify-icon> 2</span>
                            <span class="flex items-center gap-1"><iconify-icon icon="lucide:x-circle" class="text-danger"></iconify-icon> 0</span>
                        </div>
                    </div>
                </div>
                <div class="flex-1 overflow-y-auto p-2 font-mono text-[12px] space-y-1">
                    <div class="px-2 py-1.5 hover:bg-el-overlay rounded-el flex gap-3">
                        <iconify-icon icon="lucide:info" class="text-primary mt-0.5"></iconify-icon>
                        <div>
                            <div class="text-el-text">[编辑器] 资源包重建完成，耗时 1.2s</div>
                            <div class="text-[10px] opacity-40">Engine.Debug:Log(Object)</div>
                        </div>
                    </div>
                    <div class="px-2 py-1.5 hover:bg-el-overlay rounded-el flex gap-3">
                        <iconify-icon icon="lucide:alert-triangle" class="text-warning mt-0.5"></iconify-icon>
                        <div>
                            <div class="text-warning">着色器 'Custom/Player' 包含大量指令。</div>
                            <div class="text-[10px] opacity-40">ShaderCompiler:Process(Shader)</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- Right Sidebar - Inspector (右侧检查器面板) -->
        <aside class="w-80 bg-el-panel border-l border-el-border flex flex-col shrink-0">
            <div class="h-10 px-4 border-b border-el-border flex items-center">
                <span class="font-medium">检查器</span>
                <div class="flex-1"></div>
                <iconify-icon icon="lucide:settings-2" class="text-lg cursor-pointer hover:text-primary"></iconify-icon>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-6">
                <!-- 对象头部 -->
                <div class="space-y-4">
                    <div class="flex items-center gap-3">
                        <div class="w-4 h-4 rounded-el bg-primary/20 border border-primary/50"></div>
                        <input type="text" value="玩家" class="flex-1 bg-el-input border border-el-border rounded-el px-3 py-1.5 text-sm font-medium focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
                    </div>
                    <div class="grid grid-cols-2 gap-4 text-xs">
                        <div class="space-y-1.5">
                            <label class="text-el-text opacity-60">标签</label>
                            <div class="relative">
                                <select class="w-full bg-el-input border border-el-border rounded-el px-2 py-1.5 appearance-none focus:border-primary outline-none">
                                    <option>玩家</option>
                                </select>
                                <iconify-icon icon="lucide:chevron-down" class="absolute right-2 top-2 pointer-events-none opacity-50"></iconify-icon>
                            </div>
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-el-text opacity-60">层</label>
                            <div class="relative">
                                <select class="w-full bg-el-input border border-el-border rounded-el px-2 py-1.5 appearance-none focus:border-primary outline-none">
                                    <option>默认</option>
                                </select>
                                <iconify-icon icon="lucide:chevron-down" class="absolute right-2 top-2 pointer-events-none opacity-50"></iconify-icon>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="h-px bg-el-border"></div>

                <!-- 组件 -->
                <div class="space-y-4">
                    <!-- Transform -->
                    <div class="space-y-3">
                        <div class="flex items-center gap-2 group cursor-pointer">
                            <iconify-icon icon="lucide:chevron-down" class="text-xs transition-transform group-hover:text-primary"></iconify-icon>
                            <span class="font-semibold">变换</span>
                        </div>
                        <div class="space-y-2">
                            <div class="flex items-center">
                                <span class="w-20 text-xs opacity-60">位置</span>
                                <div class="flex-1 grid grid-cols-3 gap-1">
                                    <input type="text" value="0.00" class="bg-el-input border border-el-border rounded-el px-2 py-1 text-center text-[11px] focus:border-primary outline-none">
                                    <input type="text" value="1.50" class="bg-el-input border border-el-border rounded-el px-2 py-1 text-center text-[11px] focus:border-primary outline-none">
                                    <input type="text" value="0.00" class="bg-el-input border border-el-border rounded-el px-2 py-1 text-center text-[11px] focus:border-primary outline-none">
                                </div>
                            </div>
                            <div class="flex items-center">
                                <span class="w-20 text-xs opacity-60">旋转</span>
                                <div class="flex-1 grid grid-cols-3 gap-1">
                                    <input type="text" value="0.0" class="bg-el-input border border-el-border rounded-el px-2 py-1 text-center text-[11px] focus:border-primary outline-none">
                                    <input type="text" value="45.0" class="bg-el-input border border-el-border rounded-el px-2 py-1 text-center text-[11px] focus:border-primary outline-none">
                                    <input type="text" value="0.0" class="bg-el-input border border-el-border rounded-el px-2 py-1 text-center text-[11px] focus:border-primary outline-none">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 组件示例 -->
                    <div class="space-y-3 p-3 bg-el-overlay rounded-el border border-el-border">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <iconify-icon icon="lucide:file-code-2" class="text-primary"></iconify-icon>
                                <span class="font-semibold">玩家控制器</span>
                            </div>
                            <iconify-icon icon="lucide:more-vertical" class="opacity-40 hover:opacity-100 cursor-pointer"></iconify-icon>
                        </div>
                        <div class="space-y-3">
                            <div class="space-y-1">
                                <label class="text-[11px] opacity-60 uppercase tracking-wider">移动速度</label>
                                <div class="flex items-center gap-2">
                                    <input type="range" class="flex-1 accent-primary h-1 bg-el-border rounded-full appearance-none">
                                    <span class="text-xs w-8 text-right font-mono">5.0</span>
                                </div>
                            </div>
                            <div class="flex items-center justify-between">
                                <label class="text-[11px] opacity-60 uppercase tracking-wider">自动跳跃</label>
                                <div class="w-8 h-4 bg-primary rounded-full relative cursor-pointer shadow-inner">
                                    <div class="absolute right-1 top-0.5 w-3 h-3 bg-white rounded-full shadow-sm"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 添加组件按钮 -->
                <button class="w-full h-9 bg-primary hover:bg-primary/90 text-white rounded-el font-medium transition-all shadow-md active:scale-[0.98] flex items-center justify-center gap-2">
                    <iconify-icon icon="lucide:plus" class="text-lg"></iconify-icon>
                    添加组件
                </button>
            </div>
        </aside>
    </div>
    
    <!-- Footer / Status Bar (底部状态栏) -->
    <footer class="h-7 bg-el-header border-t border-el-border flex items-center px-4 justify-between text-[11px] text-el-text opacity-70 shrink-0">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-1">
                <iconify-icon icon="lucide:info" class="text-primary"></iconify-icon>
                <span>就绪</span>
            </div>
            <span>对象: 124</span>
            <span>绘制调用: 243</span>
        </div>
        <div class="flex items-center gap-6">
            <span class="text-primary hover:underline cursor-pointer">Feng3D Editor 0.6.0</span>
        </div>
    </footer>
</body>
</html>
